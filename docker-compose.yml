services:
  watch-together:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      PORT: "8787"
      WATCH_TOGETHER_SECRET: "${WATCH_TOGETHER_SECRET:?Set WATCH_TOGETHER_SECRET in .env}"
      ALLOW_ANONYMOUS: "${ALLOW_ANONYMOUS:-false}"
      WATCH_TOGETHER_ALLOWED_ORIGINS: "${WATCH_TOGETHER_ALLOWED_ORIGINS:?Set WATCH_TOGETHER_ALLOWED_ORIGINS in .env}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-true}"
      MAX_ROOM_MEMBERS: "12"
      ROOM_TTL_MINUTES: "360"
      MAX_CONNECTIONS: "1000"
      MAX_CONNECTIONS_PER_ADDRESS: "20"
      MESSAGES_PER_SECOND: "30"
      MESSAGE_BURST: "60"
